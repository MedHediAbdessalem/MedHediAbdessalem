<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc">
  <title id="title">Authored commit history</title>
  <desc id="desc">4,868 authored commits across four codebases. 1,261 in 2025 and 3,607 in 2026 through November 18. The line shows the running total by month.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#141c34"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#68e6dc"/>
      <stop offset="1" stop-color="#91d1ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#73e8df" stop-opacity=".27"/>
      <stop offset="1" stop-color="#73e8df" stop-opacity=".02"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #f0f4ff; }
      .label { font-size: 18px; fill: #bbc8df; }
      .heading { font-size: 24px; font-weight: 650; }
      .value { font-size: 22px; font-weight: 650; }
    </style>
  </defs>

  <rect x=".5" y=".5" width="759" height="535" rx="23" fill="url(#background)" stroke="#343f59"/>
  <text x="48" y="48" class="label">Authored commits</text>
  <text x="45" y="111" font-size="66" font-weight="700" fill="#f0f4ff">4,868</text>
  <rect x="548" y="66" width="164" height="37" rx="18.5" fill="#253552"/>
  <text x="630" y="90" text-anchor="middle" class="label">Jul 2025–Nov 2026</text>
  <path d="M48 137H712" stroke="#35415a"/>

  <text x="48" y="179" class="heading">Commits by year</text>
  <text x="48" y="218" class="label">2025</text><rect x="125" y="204" width="441" height="17" rx="8.5" fill="#28344d"/><rect x="125" y="204" width="139.03" height="17" rx="8.5" fill="#b0a6ff"/><text x="712" y="218" text-anchor="end" class="value">1,261</text><text x="48" y="261" class="label">2026</text><rect x="125" y="247" width="441" height="17" rx="8.5" fill="#28344d"/><rect x="125" y="247" width="397.67" height="17" rx="8.5" fill="url(#accent)"/><text x="712" y="261" text-anchor="end" class="value">3,607</text>

  <text x="48" y="311" class="heading">Cumulative commits</text>
  <path d="M118 473H692" stroke="#35415a"/><text x="98" y="478" text-anchor="end" class="label">0</text><path d="M118 406H692" stroke="#35415a"/><text x="98" y="411" text-anchor="end" class="label">2,500</text><path d="M118 339H692" stroke="#35415a"/><text x="98" y="344" text-anchor="end" class="label">5,000</text>
  <polygon points="118.0,473.0 151.8,468.1 185.5,460.1 219.3,453.1 253.1,448.0 286.8,444.1 320.6,439.2 354.4,437.0 388.1,433.1 421.9,429.9 455.6,426.9 489.4,421.5 523.2,410.6 556.9,396.0 590.7,384.6 624.5,365.1 658.2,349.4 692.0,342.5 692,473" fill="url(#area)"/>
  <polyline points="118.0,473.0 151.8,468.1 185.5,460.1 219.3,453.1 253.1,448.0 286.8,444.1 320.6,439.2 354.4,437.0 388.1,433.1 421.9,429.9 455.6,426.9 489.4,421.5 523.2,410.6 556.9,396.0 590.7,384.6 624.5,365.1 658.2,349.4 692.0,342.5" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="692" cy="342.54" r="6" fill="#91d1ff" stroke="#141c34" stroke-width="2"/>
  <text x="118.0" y="504" text-anchor="start" class="label">Jul ’25</text><text x="354.4" y="504" text-anchor="middle" class="label">Jan ’26</text><text x="523.2" y="504" text-anchor="middle" class="label">Jun ’26</text><text x="692.0" y="504" text-anchor="end" class="label">Nov ’26</text>
</svg>
