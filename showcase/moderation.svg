<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" role="img" aria-labelledby="title description">
  <title id="title">From upload to moderation decision</title>
  <desc id="description">Upload to AI screening to Decision.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#151f39"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#ffc4da"/>
      <stop offset="1" stop-color="#c8b8ff"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8fa7d8" fill-opacity=".13"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #f2f6ff; }
    .step { font-size: 20px; font-weight: 700; }
    .note { font-size: 15px; fill: #becce6; }
    .signal { opacity: 0; animation: travel 3.2s ease-in-out infinite; }
    .second { animation-delay: 1.05s; }
    @keyframes travel {
      0% { opacity: 0; transform: translateX(0); }
      9% { opacity: 1; }
      31% { opacity: 1; }
      40% { opacity: 0; transform: translateX(55px); }
      100% { opacity: 0; transform: translateX(55px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; }
    }
  </style>
  <rect x=".5" y=".5" width="759" height="207" rx="20" fill="url(#surface)" stroke="#3a4a67"/>
  <rect x="2" y="2" width="756" height="204" rx="18" fill="url(#grid)"/>
  <rect x="28" y="22" width="42" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="28" y="56" font-size="26" font-weight="700">From upload to moderation decision</text>
  <path d="M213 128h74M472 128h74" fill="none" stroke="#c8b8ff" stroke-opacity=".62" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="m276 123 5 5-5 5m259-10 5 5-5 5" stroke="#c8b8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g transform="translate(28 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#ffc4da" fill-opacity=".14" stroke="#ffc4da" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#ffc4da" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="20" height="20" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m4 20 5-5 4 3 4-6 6 7"/></g>
    <text x="14" y="73" class="step">Upload</text>
    <text x="14" y="94" class="note">Text or media</text>
  </g>
<g transform="translate(287 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#ffc4da" fill-opacity=".14" stroke="#ffc4da" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#ffc4da" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m14-6h4a2 2 0 0 1 2 2v4M3 17v4a2 2 0 0 0 2 2h4m14-6v4a2 2 0 0 1-2 2h-4M6 13h14"/></g>
    <text x="14" y="73" class="step">AI screening</text>
    <text x="14" y="94" class="note">Content checks</text>
  </g>
<g transform="translate(546 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#ffc4da" fill-opacity=".14" stroke="#ffc4da" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#ffc4da" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5c3 2.2 6 3.5 9 4v5.8c0 4.7-3.1 8.5-9 11.2-5.9-2.7-9-6.5-9-11.2V6.5c3-.5 6-1.8 9-4Z"/><path d="m9 13 2.7 2.7L17 10"/></g>
    <text x="14" y="73" class="step">Decision</text>
    <text x="14" y="94" class="note">Allow or block</text>
  </g>
  <circle class="signal" cx="221" cy="128" r="4.5" fill="#ffc4da"/>
  <circle class="signal second" cx="480" cy="128" r="4.5" fill="#ffc4da"/>
</svg>
