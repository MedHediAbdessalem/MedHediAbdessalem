<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" role="img" aria-labelledby="title description">
  <title id="title">From checkout to wallet</title>
  <desc id="description">Checkout to Confirmation to E-wallet.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#151f39"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#88e7e1"/>
      <stop offset="1" stop-color="#a8b9ff"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8fa7d8" fill-opacity=".13"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #f2f6ff; }
    .step { font-size: 20px; font-weight: 700; }
    .note { font-size: 15px; fill: #becce6; }
    .signal { opacity: 0; animation: travel 3.2s ease-in-out infinite; }
    .second { animation-delay: 1.05s; }
    @keyframes travel {
      0% { opacity: 0; transform: translateX(0); }
      9% { opacity: 1; }
      31% { opacity: 1; }
      40% { opacity: 0; transform: translateX(55px); }
      100% { opacity: 0; transform: translateX(55px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; }
    }
  </style>
  <rect x=".5" y=".5" width="759" height="207" rx="20" fill="url(#surface)" stroke="#3a4a67"/>
  <rect x="2" y="2" width="756" height="204" rx="18" fill="url(#grid)"/>
  <rect x="28" y="22" width="42" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="28" y="56" font-size="26" font-weight="700">From checkout to wallet</text>
  <path d="M213 128h74M472 128h74" fill="none" stroke="#a8b9ff" stroke-opacity=".62" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="m276 123 5 5-5 5m259-10 5 5-5 5" stroke="#a8b9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g transform="translate(28 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#88e7e1" fill-opacity=".14" stroke="#88e7e1" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#88e7e1" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="22" height="16" rx="3"/><path d="M2 10h22M6 17h5"/></g>
    <text x="14" y="73" class="step">Checkout</text>
    <text x="14" y="94" class="note">Stripe PaymentSheet</text>
  </g>
<g transform="translate(287 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#88e7e1" fill-opacity=".14" stroke="#88e7e1" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#88e7e1" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 5 5-5 5M17 8H8a5 5 0 1 0 0 10h10m-4-5 5 5-5 5"/></g>
    <text x="14" y="73" class="step">Confirmation</text>
    <text x="14" y="94" class="note">Verified webhook</text>
  </g>
<g transform="translate(546 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#88e7e1" fill-opacity=".14" stroke="#88e7e1" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#88e7e1" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><path d="M22 8V6H6a3 3 0 0 0 0 6h16v10H6a3 3 0 0 1-3-3V9M22 12h2v6h-6a3 3 0 0 1 0-6h4"/></g>
    <text x="14" y="73" class="step">E-wallet</text>
    <text x="14" y="94" class="note">Funds and history</text>
  </g>
  <circle class="signal" cx="221" cy="128" r="4.5" fill="#88e7e1"/>
  <circle class="signal second" cx="480" cy="128" r="4.5" fill="#88e7e1"/>
</svg>
