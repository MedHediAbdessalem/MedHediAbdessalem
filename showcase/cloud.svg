<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" role="img" aria-labelledby="title description">
  <title id="title">From canvas to saved design</title>
  <desc id="description">Design to Save to Reopen.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#151f39"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#a6dfb5"/>
      <stop offset="1" stop-color="#93dcff"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8fa7d8" fill-opacity=".13"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #f2f6ff; }
    .step { font-size: 20px; font-weight: 700; }
    .note { font-size: 15px; fill: #becce6; }
    .signal { opacity: 0; animation: travel 3.2s ease-in-out infinite; }
    .second { animation-delay: 1.05s; }
    @keyframes travel {
      0% { opacity: 0; transform: translateX(0); }
      9% { opacity: 1; }
      31% { opacity: 1; }
      40% { opacity: 0; transform: translateX(55px); }
      100% { opacity: 0; transform: translateX(55px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; }
    }
  </style>
  <rect x=".5" y=".5" width="759" height="207" rx="20" fill="url(#surface)" stroke="#3a4a67"/>
  <rect x="2" y="2" width="756" height="204" rx="18" fill="url(#grid)"/>
  <rect x="28" y="22" width="42" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="28" y="56" font-size="26" font-weight="700">From canvas to saved design</text>
  <path d="M213 128h74M472 128h74" fill="none" stroke="#93dcff" stroke-opacity=".62" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="m276 123 5 5-5 5m259-10 5 5-5 5" stroke="#93dcff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g transform="translate(28 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#a6dfb5" fill-opacity=".14" stroke="#a6dfb5" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#a6dfb5" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="16" y="16" width="7" height="7" rx="1.5"/><path d="M10 6.5h5a4.5 4.5 0 0 1 4.5 4.5v5M6.5 13v4a2 2 0 0 0 2 2H13"/></g>
    <text x="14" y="73" class="step">Design</text>
    <text x="14" y="94" class="note">Architecture canvas</text>
  </g>
<g transform="translate(287 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#a6dfb5" fill-opacity=".14" stroke="#a6dfb5" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#a6dfb5" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><ellipse cx="13" cy="6" rx="9" ry="3.5"/><path d="M4 6v14c0 4.7 18 4.7 18 0V6M4 13c0 4.7 18 4.7 18 0"/></g>
    <text x="14" y="73" class="step">Save</text>
    <text x="14" y="94" class="note">PostgreSQL workspace</text>
  </g>
<g transform="translate(546 77)">
    <rect width="186" height="105" rx="15" fill="#182641" stroke="#3a4a67"/>
    <rect x="14" y="14" width="37" height="37" rx="10" fill="#a6dfb5" fill-opacity=".14" stroke="#a6dfb5" stroke-opacity=".27"/>
    <g transform="translate(21 21) scale(.88)" fill="none" stroke="#a6dfb5" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a10 10 0 1 1 1.5 6M3 5v7h7m3-5v6l4 2"/></g>
    <text x="14" y="73" class="step">Reopen</text>
    <text x="14" y="94" class="note">Restore the diagram</text>
  </g>
  <circle class="signal" cx="221" cy="128" r="4.5" fill="#a6dfb5"/>
  <circle class="signal second" cx="480" cy="128" r="4.5" fill="#a6dfb5"/>
</svg>
